name: Import LSOA Website Package

on:
  push:
    branches: [main]
    paths:
      - 'LSOA-Website-Version-5-GitHub-Upload.zip'
      - '.github/workflows/import-lsoa.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor == 'allyustrading'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract website package
        run: |
          rm -rf LSOA-Website-Version-5
          unzip -q LSOA-Website-Version-5-GitHub-Upload.zip
          cp -a LSOA-Website-Version-5/. .
          rm -rf LSOA-Website-Version-5
          rm -f LSOA-Website-Version-5-GitHub-Upload.zip
      - name: Commit website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Deploy LSOA Website Version 5"
          git push
